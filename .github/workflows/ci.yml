name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Windows MSVC"
            os: windows-latest
            generator: "Visual Studio 17 2022"
            config: "Release"
#          - name: "Ubuntu GCC"
#            os: ubuntu-latest
#            generator: "Unix Makefiles"
#            config: "Release"
#            cc: "gcc-11"
#            cxx: "g++-11"


    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.5
        with:
          vcpkgGitCommitId: 'd1ff36c6520ee43f1a656c03cd6425c2974a449e'

      - name: Configure CMake
        run: |
          cmake -B build -G "${{ matrix.config.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.config.config }} -DBUILD_TESTING=ON -DBUILD_EXAMPLES=ON -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config.config }}

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.config.config }} --output-on-failure

