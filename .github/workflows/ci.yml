name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Windows MSVC"
            os: windows-latest
            generator: "Visual Studio 17 2022"
            config: "Release"
#          - name: "Ubuntu GCC"
#            os: ubuntu-latest
#            generator: "Unix Makefiles"
#            config: "Release"
#            cc: "gcc-11"
#            cxx: "g++-11"
#          - name: "Ubuntu Clang"
#            os: ubuntu-latest
#            generator: "Unix Makefiles"
#            config: "Release"
#            cc: "clang-14"
#            cxx: "clang++-14"
#          - name: "macOS"
#            os: macos-latest
#            generator: "Unix Makefiles"
#            config: "Release"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

#      - name: Set up environment (Linux)
#        if: runner.os == 'Linux'
#        run: |
#          sudo apt-get update
#          sudo apt-get install -y cmake ninja-build
#
#      - name: Set up environment (macOS)
#        if: runner.os == 'macOS'
#        run: |
#          brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build -G "${{ matrix.config.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.config.config }} -DBUILD_TESTING=ON -DBUILD_EXAMPLES=ON
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config.config }}

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.config.config }} --output-on-failure

#  code-quality:
#    name: Code Quality
#    runs-on: ubuntu-latest
#
#    steps:
#      - name: Checkout code
#        uses: actions/checkout@v5.0.0
#
#      - name: Set up Clang tools
#        run: |
#          sudo apt-get update
#          sudo apt-get install -y clang-format-14 clang-tidy-14
#
#      - name: Check formatting
#        run: |
#          find geometry3d composite -name '*.h' -o -name '*.cpp' | xargs clang-format-14 --dry-run --Werror

  vcpkg-build:
    name: vcpkg Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.5

      - name: Build with vcpkg
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          cmake --build build
